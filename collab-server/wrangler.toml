# noteser live-collaboration server — Cloudflare Worker + Durable Objects.
# One Durable Object instance per collab room (= per note), so document
# state and connected peers for a note always live in the same place.
#
# Deploy: npx wrangler deploy   (see README.md for the full setup)

name = "noteser-collab"
main = "src/index.ts"
compatibility_date = "2026-01-01"
routes = [{ pattern = "collab.noteser.app", custom_domain = true }]

[vars]
# Browser origins that may open a socket (README "Origin allowlist"): every
# host serving a build whose CSP carries the ws source (prod: apex + its three
# vercel.app aliases; dev branch: beta, dev + its alias), deployment URLs
# (`*` = [a-z0-9]+, so no branch alias), local `npm run dev`. .dev.vars overrides.
ALLOWED_ORIGINS = "https://noteser.app https://noteser.vercel.app https://noteser-ipapakonstantinous-projects.vercel.app https://noteser-git-main-ipapakonstantinous-projects.vercel.app https://beta.noteser.app https://dev.noteser.app https://noteser-git-dev-ipapakonstantinous-projects.vercel.app https://noteser-*-ipapakonstantinous-projects.vercel.app http://localhost:3001 http://127.0.0.1:3001"

[[durable_objects.bindings]]
name = "Y_ROOM"
class_name = "YRoom"

# SQLite-backed Durable Objects — required on the Workers FREE plan
# (key-value-backed DOs need the paid plan; SQLite-backed ones do not).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["YRoom"]
